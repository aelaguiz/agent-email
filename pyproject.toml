[project]
name = "agent-email"
version = "0.1.0"
description = "Email your coding agents: a reply tells the session that sent the email to read it, on any machine."
requires-python = ">=3.12"
dependencies = ["approvals @ git+https://github.com/aelaguiz/agent-approvals@96c8099af1e288ba2a97e87b8b69db66aae9de4b"]

[project.scripts]
agent-email = "agent_email.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_email"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
