[project]
name = "agent-email"
version = "0.1.0"
description = "Email your coding agents: a reply tells the session that sent the email to read it, on any machine."
requires-python = ">=3.12"
dependencies = ["approvals @ git+https://github.com/aelaguiz/agent-approvals@49a01b68d0b480440b0ca04ebe7709d0bedf6e63"]

[project.scripts]
agent-email = "agent_email.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_email"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
